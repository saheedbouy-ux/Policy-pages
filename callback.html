<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TikTok Auth Callback</title>
</head>
<body>
<h1>TikTok Authorization</h1>
<p>Copy the code below back to Jeenix:</p>
<pre id="code" style="font-size:20px;padding:10px;background:#eee;"></pre>
<script>
const params = new URLSearchParams(window.location.search);
document.getElementById('code').textContent = params.get('code') || '(no code found in URL)';
</script>
</body>
</html>
